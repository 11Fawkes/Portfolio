<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <script>
      // GitHub Pages SPA redirect (spa-github-pages technique by rafrex).
      // When GitHub Pages serves a 404, this page captures the URL and
      // redirects to index.html with the path stored in a query param.
      // index.html then restores the correct URL via history.replaceState.
      //
      // pathSegmentsToKeep = 1 keeps "/Portfolio" in the path and only
      // converts the route portion (e.g. /projects) to a query param.
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
